<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Başvurunuz Alındı — YesPDF Lisans Geçiş Programı</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://yespdf.com.tr/kampanya/lisans-gecis/tesekkurler.html">
<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/favicon.png">
<meta name="theme-color" content="#0C2B4C">
<style>
  :root { --lacivert: #0C2B4C; --yesil: #276113; --metin: #14263b; --soluk: #5b6b7e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif; color: var(--metin); background: linear-gradient(135deg, var(--lacivert) 0%, #12406f 100%); min-height: 100vh; display: grid; place-items: center; padding: 24px; line-height: 1.55; }
  .kutu { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 560px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .tamam { width: 64px; height: 64px; border-radius: 50%; background: var(--yesil); margin: 0 auto 18px; display: grid; place-items: center; }
  .tamam svg { width: 30px; height: 30px; }
  h1 { font-size: 1.7rem; color: var(--lacivert); margin: 0 0 10px; }
  p { color: var(--soluk); margin: 0 0 8px; }
  .btn { display: inline-block; background: var(--yesil); color: #fff; text-decoration: none; font-weight: 600; padding: 13px 26px; border-radius: 10px; margin-top: 18px; }
  .btn:hover { background: #1f4d0f; }
</style>
</head>
<body>
<div class="kutu">
  <div class="tamam" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
  <h1>Başvurunuz alındı</h1>
  <p>Satış ekibimiz 1 iş günü içinde sizinle iletişime geçecek.</p>
  <p>Lisans kanıtını formla göndermediyseniz, e-postayla da iletebilirsiniz.</p>
  <a class="btn" href="https://yespdf.com.tr/">YesPDF ana sayfaya dön</a>
</div>
</body>
</html>
